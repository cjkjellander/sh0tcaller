name: Automatic testing
on: [push]
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
env:
  OTP_VERSION: "29.0.5"
  REBAR3_VERSION: "3.27.0"

jobs:
  compile-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "${{ env.OTP_VERSION }}"
          rebar3-version: "${{ env.REBAR3_VERSION }}"
      # The alsa dependency builds NIFs and a port program against libasound.
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Fetch dependencies from cache
        uses: actions/cache@v4
        id: cache
        with:
          path: |
            _build/*/*/*
            ebin
          key: deps-v1-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.REBAR3_VERSION }}-${{ hashFiles('rebar.*') }}
      - name: Compile deps
        if: steps.cache.outputs.cache-hit != 'true'
        run: rebar3 as test compile --deps_only

  compile:
    needs: [compile-deps]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "${{ env.OTP_VERSION }}"
          rebar3-version: "${{ env.REBAR3_VERSION }}"
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Fetch dependencies from cache
        uses: actions/cache@v4
        id: cached-deps
        with:
          path: |
            _build/*/*/*
            ebin
          key: deps-v1-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.REBAR3_VERSION }}-${{ hashFiles('rebar.*') }}
      - name: Fetch workspace from cache
        uses: actions/cache@v4
        id: cached-workspace
        with:
          path: |
            _build/*/*/*
            ebin
          key: workspace-${{ github.run_id }}
      # A restored cache can still hold a module that has since been renamed or
      # deleted -- rebar3 copies test sources into _build and never removes the
      # orphans, and CT then tries to compile a suite that no longer exists.
      # Deps stay cached; recompiling sh0tcaller itself takes seconds.
      - name: Drop this app's previous build output
        run: rm -rf _build/*/lib/sh0tcaller

      - name: Compile
        run: rebar3 as test compile

  xref:
    needs: [compile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "${{ env.OTP_VERSION }}"
          rebar3-version: "${{ env.REBAR3_VERSION }}"
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Fetch workspace from cache
        uses: actions/cache@v4
        id: cached-workspace
        with:
          path: |
            _build/*/*/*
            ebin
          key: workspace-${{ github.run_id }}
      - name: Run xref
        run: rebar3 xref

  ct:
    needs: [compile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "${{ env.OTP_VERSION }}"
          rebar3-version: "${{ env.REBAR3_VERSION }}"
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Fetch workspace from cache
        uses: actions/cache@v4
        id: cached-workspace
        with:
          path: |
            _build/*/*/*
            ebin
          key: workspace-${{ github.run_id }}
      - name: Run CT tests
        run: rebar3 ct

  eunit:
    needs: [compile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "${{ env.OTP_VERSION }}"
          rebar3-version: "${{ env.REBAR3_VERSION }}"
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Fetch workspace from cache
        uses: actions/cache@v4
        id: cached-workspace
        with:
          path: |
            _build/*/*/*
            ebin
          key: workspace-${{ github.run_id }}
      - name: Run EUnit tests
        run: rebar3 eunit

  dialyzer:
    needs: [compile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "${{ env.OTP_VERSION }}"
          rebar3-version: "${{ env.REBAR3_VERSION }}"
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Fetch workspace from cache
        uses: actions/cache@v4
        id: cached-workspace
        with:
          path: |
            _build/*/*/*
            ebin
          key: workspace-dialyzer-${{ github.run_id }}
          restore-keys:
            workspace-${{ github.run_id }}
      - name: Run Dialyzer
        run: rebar3 dialyzer
